name: 차트팩 갱신

on:
  schedule:
    # 평일 05:00 UTC. 주 1회(월요일)에서 2026-10-05 에 바꿨다.
    #
    # 날마다 바뀌는 계열이 있다 — 주가 월말 종가, 미국·한국 10년물, 환율,
    # €STR. 주 1회면 월요일 값이 금요일까지 그대로 걸려 있었다.
    #
    # 돌려 보고 바꾼 것이다. 한 번에 8분, 바깥 호출 81회, 저장소는 꾸린 뒤
    # 한 판에 8KB 꼴(평일 매일이면 연 2MB). 걸림돌이 없다. 2026-10-05 에
    # OECD·ifo·ECOS 가 차례로 조인 적이 있는데, 그건 세 시간에 열 번을 돌려
    # 생긴 일이지 하루 한 번과는 다른 이야기다.
    #
    # 주말은 뺀다. 시장이 쉬어 바뀔 것이 없다.
    #
    # **이것은 예비 장치다.** GitHub 예약은 몇 시간씩 밀린다(2026-10-05 에
    # 7시간 밀리는 것을 보았다). 정시 갱신은 cron-job.org 가 현지 07:00 에
    # workflow_dispatch 를 찔러서 한다 — 조간 브리핑(08:00)보다 앞서야
    # 그날 링크가 최신이다.
    - cron: "0 5 * * 1-5"
  workflow_dispatch:
    inputs:
      check_only:
        description: "쓰지 않고 대조만 한다 (무엇이 달라지는지 먼저 보기)"
        type: boolean
        default: false

permissions:
  contents: write          # 갱신된 index.html 을 되커밋한다

concurrency:
  group: chartpack
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # OECD 가 호출이 몰리면 429 를 내고, 그때 뒤로 물러나 기다리느라 실행이
    # 길어진다. 평소에는 3분이면 끝나지만 여유를 둔다. 한 계열이 끝내 실패해도
    # 빌드는 이전 값을 물려 쓰고 계속 간다.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: pip install --quiet -r requirements.txt

      - name: 빌드
        env:
          # 한국 품목별 소비자물가(한국은행 ECOS). 없으면 그 구획만 빠진다.
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: |
          python build/build.py ${{ inputs.check_only && '--check' || '' }}

      - name: 갱신분 되커밋
        if: ${{ !inputs.check_only }}
        run: |
          git config user.name  "chartpack-bot"
          git config user.email "chartpack-bot@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "달라진 수치가 없다 — 커밋 생략"
            exit 0
          fi
          git commit -m "차트팩 갱신 $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            if git push; then echo "완료 (시도 $i)"; exit 0; fi
            git pull --rebase --autostash origin main || exit 1
            sleep 3
          done
          echo "::error::되커밋 실패"
          exit 1
