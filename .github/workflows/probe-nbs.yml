name: (일회용) 중국 NBS 도달 시험

# 중국 산업생산을 국가통계국(NBS)에서 받을 수 있는지 알아보려고 한 번만
# 돌리는 것이다. 프랑크푸르트 사무소 회선에서는 data.stats.gov.cn 의 데이터
# API 가 403(reason:UrlACL)으로 막힌다 — 브라우저로 열어도 같다. 망 차원
# 차단이라 IP 가 다르면 결과가 달라질 수 있어, 미국에 있는 러너에서 확인한다.
#
# 결과를 보고 지운다. 예약 없이 손으로만 돌아간다.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 어디서 나가는지
        run: curl -s --max-time 20 https://api.ipify.org || echo "(IP 확인 실패)"

      - name: NBS 데이터 API
        run: |
          URL='https://data.stats.gov.cn/easyquery.htm?m=QueryData&dbcode=hgyd&rowcode=zb&colcode=sj&wds=%5B%5D&dfwds=%5B%7B%22wdcode%22%3A%22zb%22%2C%22valuecode%22%3A%22A020101%22%7D%5D'
          echo "--- 상태코드 ---"
          curl -s -o /tmp/nbs.txt -w '%{http_code}\n' --max-time 30 \
            -H 'User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/124.0' \
            -H 'Referer: https://data.stats.gov.cn/easyquery.htm?cn=A01' \
            "$URL" || echo "(요청 자체 실패)"
          echo "--- 앞 400자 ---"
          head -c 400 /tmp/nbs.txt || true
          echo

      - name: NBS 본사이트
        run: |
          curl -s -o /dev/null -w 'www.stats.gov.cn %{http_code}\n' --max-time 20 \
            -H 'User-Agent: Mozilla/5.0' https://www.stats.gov.cn/ || echo "(실패)"

      - name: FRED 에 중국 산업생산 계열이 있나
        run: |
          for id in CHNPROINDMISMEI CHNPRINTO01GPSAM CHNPRINTO01IXOBSAM CHNPRMNTO01IXOBSAM; do
            code=$(curl -s -o /tmp/f.csv -w '%{http_code}' --max-time 20 \
              "https://fred.stlouisfed.org/graph/fredgraph.csv?id=$id") || code=ERR
            echo "--- $id : $code"
            head -c 120 /tmp/f.csv 2>/dev/null; echo
          done
